<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter for you 💌</title>
<style>
:root{--bg1:#f3e3c3;--bg2:#d9b98a;--env:#e8cfa0;--env-in:#c9a56f;--pocket:#f0dcb0;--ink:#4a2c1d;--seal:#a51c26;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1a16;--bg2:#120a08;--env:#c9a56f;--env-in:#8a6a3f;--pocket:#d8b87f;--ink:#f1dfbf;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1a16;--bg2:#120a08;--env:#c9a56f;--env-in:#8a6a3f;--pocket:#d8b87f;--ink:#f1dfbf;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;transition:opacity .6s}
.stage.gone{opacity:0;pointer-events:none;position:absolute;inset:0}
h1{font-style:italic;font-weight:400;font-size:clamp(24px,7vw,34px);margin:0;text-align:center}
.env{position:relative;width:min(86vw,380px);aspect-ratio:3/2;background:var(--env-in);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.35);cursor:pointer;perspective:900px;animation:float 3s ease-in-out infinite;border:0;padding:0}
.env.open{animation:none}
.pocket{position:absolute;inset:0;background:var(--pocket);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:6px;z-index:3}
.flap{position:absolute;left:0;right:0;top:0;height:56%;background:var(--env);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease,z-index 0s .4s;z-index:4;border-radius:6px 6px 0 0}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:56%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8434d,var(--seal) 60%,#6b0d16);color:#5a0810;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.4);transition:opacity .3s}
.env.open .seal{opacity:0}
.tap{margin:0;font-style:italic;font-size:18px;opacity:.85;animation:pulse 1.8s ease-in-out infinite}
.view{display:none;min-height:100%;flex-direction:column;align-items:center;padding:24px 16px 40px;gap:18px}
.view.show{display:flex;animation:rise .9s ease both}
.view img{width:100%;max-width:560px;height:auto;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.view p{margin:0;font-style:italic;opacity:.8;text-align:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{opacity:.4}}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<main class="stage" id="stage">
  <h1>You’ve got a letter 💌</h1>
  <button class="env" id="env" aria-label="Open the letter"><div class="flap"></div><div class="pocket"></div><div class="seal">♥</div></button>
  <p class="tap">Tap to open</p>
</main>

<script>
(function(){
  var env=document.getElementById('env'),stage=document.getElementById('stage'),view=document.getElementById('view');
  function open(){
    if(env.classList.contains('open'))return;
    env.classList.add('open');
    setTimeout(function(){stage.classList.add('gone')},1100);
    setTimeout(function(){stage.style.display='none';view.classList.add('show');window.scrollTo(0,0)},1700);
  }
  env.addEventListener('click',open);
})();
</script>
